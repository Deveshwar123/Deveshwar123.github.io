# Checks every push and pull request. Publishing to GitHub Pages is a separate,
# manual step (Actions → "site" → Run workflow → deploy: true) so nothing goes
# live without the owner choosing to publish.
name: site

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish _site/ to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The private exclusion list is gitignored, so CI scans with the committed
      # generic patterns; run the full scan locally before publishing.
      - run: npm run validate
      - run: npm run check:drift
      - run: npm test
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
